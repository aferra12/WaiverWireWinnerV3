name: Deploy to GCP Cloud Run

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  PROJECT_ID: sanguine-robot-454100-s3
  # Renaming this would create a second service and orphan the Cloud Scheduler job
  # pointing at the old one, so the stale name is kept deliberately.
  SERVICE_NAME: run-nightly-mlb-games
  REGION: us-central1

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # google-github-actions/auth reports a missing credentials_json as "must specify
    # exactly one of workload_identity_provider or credentials_json", which reads like a
    # workflow syntax error rather than an unset secret. Name the actual problem instead.
    - name: Check required secrets are set
      run: |
        missing=""
        for name in GCP_SA_KEY FORM_TOKEN EMAIL_SENDER EMAIL_PASSWORD; do
          case "$name" in
            GCP_SA_KEY)     value="${{ secrets.GCP_SA_KEY }}" ;;
            FORM_TOKEN)     value="${{ secrets.FORM_TOKEN }}" ;;
            EMAIL_SENDER)   value="${{ secrets.EMAIL_SENDER }}" ;;
            EMAIL_PASSWORD) value="${{ secrets.EMAIL_PASSWORD }}" ;;
          esac
          [ -n "$value" ] || missing="$missing $name"
        done
        if [ -n "$missing" ]; then
          echo "Missing repository secrets:$missing"
          echo "Add them under Settings > Secrets and variables > Actions."
          exit 1
        fi
        echo "All required secrets present."

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    # `--set-env-vars` replaces the service's whole env block rather than merging, which
    # also clears the retired BigQuery variables (PROJECT_ID, BIG_QUERY_TABLE). The `^@^`
    # prefix switches the delimiter from comma to @, so a value containing a comma cannot
    # split itself into two variables.
    #
    # BASE_URL is deliberately absent here; the next step sets it from the service's own
    # URL, which is not knowable until the service exists.
    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy "$SERVICE_NAME" \
          --source . \
          --project "$PROJECT_ID" \
          --region "$REGION" \
          --platform managed \
          --allow-unauthenticated \
          --memory 512Mi \
          --timeout 300 \
          --set-env-vars "^@^FORM_TOKEN=${{ secrets.FORM_TOKEN }}@EMAIL_SENDER=${{ secrets.EMAIL_SENDER }}@EMAIL_PASSWORD=${{ secrets.EMAIL_PASSWORD }}@EMAIL_RECIPIENT=${{ secrets.EMAIL_RECIPIENT }}@ESPN_LEAGUE_ID=${{ secrets.ESPN_LEAGUE_ID }}@ESPN_S2=${{ secrets.ESPN_S2 }}@ESPN_SWID=${{ secrets.ESPN_SWID }}@OWNERSHIP_THRESHOLD=${{ vars.OWNERSHIP_THRESHOLD || '7.5' }}"

    - name: Point BASE_URL at the deployed service
      run: |
        URL=$(gcloud run services describe "$SERVICE_NAME" \
              --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')
        echo "Service URL: $URL"
        echo "SERVICE_URL=$URL" >> "$GITHUB_ENV"
        gcloud run services update "$SERVICE_NAME" \
          --project "$PROJECT_ID" --region "$REGION" --update-env-vars "BASE_URL=$URL"

    - name: Smoke test
      run: |
        echo "--- health ---"
        curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "$SERVICE_URL/health"
        echo

        echo "--- rejects a bad token ---"
        code=$(curl -s -o /dev/null -w '%{http_code}' \
               -H "X-Form-Token: wrong" "$SERVICE_URL/daily_picks?send=false")
        if [ "$code" != "403" ]; then
          echo "expected 403 for a bad token, got $code"; exit 1
        fi
        echo "403 as expected"

        echo "--- rejects a missing token ---"
        code=$(curl -s -o /dev/null -w '%{http_code}' "$SERVICE_URL/daily_picks?send=false")
        if [ "$code" != "403" ]; then
          echo "expected 403 with no token, got $code"; exit 1
        fi
        echo "403 as expected"

        # The real check. FanGraphs sits behind Cloudflare and fingerprints the TLS
        # handshake, so it can accept a residential IP and still refuse a datacenter one.
        # This is the only place that gets exercised from inside Cloud Run, so a failure
        # has to break the deploy loudly rather than surface at 6am tomorrow.
        # Token goes in a header, matching how Cloud Scheduler calls it -- Cloud Run
        # records the full query string in its request logs.
        echo "--- full pipeline, no email ---"
        if ! body=$(curl -fsS --max-time 300 \
             -H "X-Form-Token: ${{ secrets.FORM_TOKEN }}" \
             "$SERVICE_URL/daily_picks?send=false"); then
          echo "Pipeline failed. If the service logs show a 403 from fangraphs.com,"
          echo "Cloudflare rejected this datacenter IP -- see the escalation ladder"
          echo "in CLAUDE.md."
          exit 1
        fi
        echo "$body"
        echo "$body" | grep -q '"count"' || { echo "unexpected response shape"; exit 1; }
