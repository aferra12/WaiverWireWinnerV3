name: Deploy to GCP Cloud Run

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  PROJECT_ID: sanguine-robot-454100-s3
  # Renaming this would create a second service and orphan the Cloud Scheduler job
  # pointing at the old one, so the stale name is kept deliberately.
  SERVICE_NAME: run-nightly-mlb-games
  REGION: us-central1

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # google-github-actions/auth reports a missing credentials_json as "must specify
    # exactly one of workload_identity_provider or credentials_json", which reads like a
    # workflow syntax error rather than an unset secret. Name the actual problem instead.
    # Secrets are passed through `env:` and read as shell variables. They must never be
    # interpolated into a `run:` body: GitHub substitutes the raw text before the shell
    # parses it, so a value containing quotes -- a service-account JSON, for one -- ends
    # the string early and the remainder is executed as commands.
    - name: Check required secrets are set
      env:
        GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        FORM_TOKEN: ${{ secrets.FORM_TOKEN }}
        EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      run: |
        missing=""
        for name in GCP_SA_KEY FORM_TOKEN EMAIL_SENDER EMAIL_PASSWORD; do
          # Indirect expansion: reads the variable named by $name without ever placing
          # its value in the script text.
          [ -n "${!name}" ] || missing="$missing $name"
        done
        if [ -n "$missing" ]; then
          echo "Missing repository secrets:$missing"
          echo "Add them under Settings > Secrets and variables > Actions."
          exit 1
        fi
        echo "All required secrets present."

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    # Environment goes in via `--env-vars-file` rather than `--set-env-vars`. The inline
    # form needs a delimiter that appears in no value, and there isn't a safe one here:
    # comma is the default, `@` collides with the email addresses, and any other choice is
    # a guess about future values. A file has no delimiter at all.
    #
    # The file is written with json.dumps, which is valid YAML and quotes every value
    # correctly, so `@`, spaces, `%` escapes and `{}` all survive untouched.
    #
    # Like `--set-env-vars`, this replaces the whole env block rather than merging, which
    # also clears the retired BigQuery variables (PROJECT_ID, BIG_QUERY_TABLE).
    #
    # BASE_URL is deliberately absent; the next step sets it from the service's own URL,
    # which is not knowable until the service exists.
    - name: Deploy to Cloud Run
      env:
        FORM_TOKEN: ${{ secrets.FORM_TOKEN }}
        EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        ESPN_LEAGUE_ID: ${{ secrets.ESPN_LEAGUE_ID }}
        ESPN_S2: ${{ secrets.ESPN_S2 }}
        ESPN_SWID: ${{ secrets.ESPN_SWID }}
        OWNERSHIP_THRESHOLD: ${{ vars.OWNERSHIP_THRESHOLD || '7.5' }}
      run: |
        ENV_FILE="$RUNNER_TEMP/env-vars.yaml"
        python3 - "$ENV_FILE" <<'PY'
        import json, os, sys

        keys = [
            "FORM_TOKEN", "EMAIL_SENDER", "EMAIL_PASSWORD", "EMAIL_RECIPIENT",
            "ESPN_LEAGUE_ID", "ESPN_S2", "ESPN_SWID", "OWNERSHIP_THRESHOLD",
        ]
        # Cloud Run rejects a null value, so an unset optional secret is omitted rather
        # than written as empty -- the app already falls back for those.
        env = {k: os.environ[k] for k in keys if os.environ.get(k)}

        with open(sys.argv[1], "w") as handle:
            json.dump(env, handle, indent=2)

        print("Setting:", ", ".join(sorted(env)))
        missing = [k for k in keys if k not in env]
        if missing:
            print("Omitted (unset):", ", ".join(missing))
        PY

        gcloud run deploy "$SERVICE_NAME" \
          --source . \
          --project "$PROJECT_ID" \
          --region "$REGION" \
          --platform managed \
          --allow-unauthenticated \
          --memory 512Mi \
          --timeout 300 \
          --env-vars-file "$ENV_FILE"

        rm -f "$ENV_FILE"

    - name: Point BASE_URL at the deployed service
      run: |
        URL=$(gcloud run services describe "$SERVICE_NAME" \
              --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')
        echo "Service URL: $URL"
        echo "SERVICE_URL=$URL" >> "$GITHUB_ENV"
        gcloud run services update "$SERVICE_NAME" \
          --project "$PROJECT_ID" --region "$REGION" --update-env-vars "BASE_URL=$URL"

    - name: Smoke test
      env:
        FORM_TOKEN: ${{ secrets.FORM_TOKEN }}
      run: |
        echo "--- health ---"
        curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "$SERVICE_URL/health"
        echo

        echo "--- rejects a bad token ---"
        code=$(curl -s -o /dev/null -w '%{http_code}' \
               -H "X-Form-Token: wrong" "$SERVICE_URL/daily_picks?send=false")
        if [ "$code" != "403" ]; then
          echo "expected 403 for a bad token, got $code"; exit 1
        fi
        echo "403 as expected"

        echo "--- rejects a missing token ---"
        code=$(curl -s -o /dev/null -w '%{http_code}' "$SERVICE_URL/daily_picks?send=false")
        if [ "$code" != "403" ]; then
          echo "expected 403 with no token, got $code"; exit 1
        fi
        echo "403 as expected"

        # The real check. FanGraphs sits behind Cloudflare and fingerprints the TLS
        # handshake, so it can accept a residential IP and still refuse a datacenter one.
        # This is the only place that gets exercised from inside Cloud Run, so a failure
        # has to break the deploy loudly rather than surface at 6am tomorrow.
        # Token goes in a header, matching how Cloud Scheduler calls it -- Cloud Run
        # records the full query string in its request logs.
        echo "--- full pipeline, no email ---"
        if ! body=$(curl -fsS --max-time 300 \
             -H "X-Form-Token: ${FORM_TOKEN}" \
             "$SERVICE_URL/daily_picks?send=false"); then
          echo "Pipeline failed. If the service logs show a 403 from fangraphs.com,"
          echo "Cloudflare rejected this datacenter IP -- see the escalation ladder"
          echo "in CLAUDE.md."
          exit 1
        fi
        echo "$body"
        echo "$body" | grep -q '"count"' || { echo "unexpected response shape"; exit 1; }
